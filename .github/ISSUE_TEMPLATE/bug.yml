name: "Bug / Баг"
description: "Something doesn't work right / Что-то работает не так"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        One bug per issue. Search first: if it's there, add 👍 and your details to it.
        Один баг - одна заявка. Сначала поищите похожие в Issues: если уже есть, поставьте 👍 и допишите своё там.

        **Files.** Drag them into any field below or paste them: screenshots, a screen recording, logs (`.txt`), the settings export (`.json`).
        **Файлы.** Перетащите в любое поле ниже или вставьте из буфера: скриншоты, запись экрана, логи (`.txt`), экспорт настроек (`.json`).

        **Logs.** Twitch settings > ReTwitch > Diagnostics > Logs for reports. Turn on the one for your problem (ad blocking log for freezes and ads, UI stall log for lag, bans and deletions log for missing messages), reproduce the problem and attach `ReTwitch-*.txt` from Downloads.

        **Логи.** Настройки Twitch > ReTwitch > «Диагностика» > «Логи для отчётов». Включите лог под вашу проблему:
        - фризы, зависания стрима, реклама - «Лог блокировки рекламы»;
        - тормоза интерфейса - «Лог подвисаний»;
        - пропавшие или удалённые сообщения - «Лог банов и удалений».

        Повторите проблему, затем приложите файл `ReTwitch-*.txt` из папки «Загрузки» (Download). Токенов и паролей в логах нет. Лог потом можно выключить.

        **Settings - required.** ReTwitch > Backup > Save to a file > `retwitch-settings-DATE.json`, attach it in the "Settings export" field. Without it we can't look into the issue: a bug often depends on what's turned on. The file has the mod's settings and Twitch's experiment flags only.
        **Настройки - обязательно.** ReTwitch > «Резервная копия» > «Сохранить в файл» > `retwitch-settings-ДАТА.json`, приложите его в поле «Экспорт настроек». Без него заявку не разобрать: баг часто зависит от того, что включено. В файле только настройки мода и флаги экспериментов Twitch.

        If the app crashes, the report is sent by itself: tell us when it happened. / Если приложение вылетает, отчёт уходит сам: напишите, во сколько это было.
  - type: input
    id: version
    attributes:
      label: "Mod version / Версия мода"
      description: "ReTwitch > About the mod / «О моде»"
      placeholder: "0.5.27-beta"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: "Device and Android / Телефон и Android"
      placeholder: "Pixel 7, Android 16"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: "What happened / Что случилось"
      description: "And what you expected instead / и что должно было быть вместо этого"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Steps to reproduce / Как повторить"
      placeholder: |
        1. Open a channel ... / Открыть канал ...
        2. Go fullscreen / Повернуть в полный экран
        3. ...
    validations:
      required: true
  - type: textarea
    id: settings
    attributes:
      label: "Settings export (required) / Экспорт настроек (обязательно)"
      description: "Drag `retwitch-settings-DATE.json` from Backup here / Перетащите сюда `retwitch-settings-ДАТА.json` из «Резервной копии»"
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: "Recording, screenshots, logs / Запись экрана, скриншоты, логи"
      description: "Drag the files here / Перетащите файлы сюда"
  - type: checkboxes
    id: checks
    attributes:
      label: "Checks / Проверки"
      options:
        - label: "There's no issue about it yet / Такой заявки ещё нет"
          required: true
        - label: "The settings export is attached / Экспорт настроек приложен"
          required: true
        - label: "Happens on the latest version / Повторяется на последней версии мода"
