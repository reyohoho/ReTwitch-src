name: "Idea / Идея"
description: "A new feature or an improvement / Новая функция или улучшение"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        One idea per issue. Search first: if it's there, give it a 👍, that's how we see what matters most.
        Одна идея - одна заявка. Сначала поищите похожие: если такая уже есть, поставьте ей 👍, так видно, что нужнее.
  - type: textarea
    id: idea
    attributes:
      label: "What you'd like / Что хочется"
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: "Why / Зачем"
      description: "What it solves, when you'd use it / какую проблему решит, когда пригодится"
  - type: textarea
    id: look
    attributes:
      label: "How it could look / Как может выглядеть"
      description: "Screenshots, sketches, how another app does it / скриншоты, наброски, как сделано в другом приложении"
